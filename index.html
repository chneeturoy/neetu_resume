<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Simplified | PM for Irish Charities & SMEs</title>

  <style>
    /* CSS Variables for consistent theming */
    :root {
      --primary-color: #0056b3;
      --secondary-color: #f8f9fa;
      --text-main: #333;
      --text-muted: #666;
      --accent-color: #e9ecef;
      --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      font-family: var(--font-stack);
      margin: 0;
      background: #ffffff;
      color: var(--text-main);
      line-height: 1.6;
    }

    /* Sticky Navigation */
    nav {
      position: sticky;
      top: 0;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 15px 0;
      z-index: 1000;
    }

    .nav-container {
      width: 90%;
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-main);
      margin-left: 20px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--primary-color);
    }

    .container {
      width: 90%;
      margin: auto;
      max-width: 1200px;
    }

    /* Hero Section */
    header.hero {
      padding: 80px 0 60px;
      text-align: center;
      background: linear-gradient(to bottom, #f1f5f9, #ffffff);
      border-bottom: 1px solid #e2e8f0;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
      color: #111;
    }

    h2 {
      margin-top: 60px;
      font-size: 32px;
      border-bottom: 3px solid var(--primary-color);
      display: inline-block;
      padding-bottom: 5px;
    }

    h3 {
      color: var(--primary-color);
      margin-top: 0;
    }

    p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: var(--primary-color);
      color: white;
      text-decoration: none;
      margin-top: 20px;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #004494;
    }
